<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Nota Mínima</title>
    <link rel="stylesheet" href="Estilo.css">
    
    
</head>
<body>
    <div id="pantalla-inicio">
        <h1>Calculadora de Nota Mínima</h1>
        <p style="max-width: 80%; margin: 10px auto; font-size: 1.1em;">
            Descubre la nota mínima que necesitas en tu tercer corte (34%) para aprobar la materia con un 3.0.
        </p>
        <button id="iniciar-calculadora">Iniciar Calculadora</button>
    </div>

    <div class="Calculadora oculto" id="calculadora-principal">
        <h1>Calculadora de Nota Mínima</h1>
        <p>Ingresa tus notas del 1er y 2do corte para saber la nota mínima que necesitas en el 3er corte para pasar con el minimo de 3.0</p>

        <form id="notas">
            <label for="nota1">Nota 1er corte (33%):</label>
            <input type="number" id="nota1" min="0" max="5" step="0.01" required>

            <label for="nota2">Nota 2do corte (33%):</label>
            <input type="number" id="nota2" min="0" max="5" step="0.01" required>

            <div class="botones-container">
                <button type="submit" id="calcular">Calcular nota mínima</button>
                <button type="button" id="limpiar">Limpiar notas</button>
            </div>
        </form>

        <div id="resultado"></div>
    </div>

   

    <script src="proceso.js"></script>
</body>
</html>
